version: "3.9"

# Redis is private to appnet — do not publish 6379 in production.
# Broker DB uses noeviction so cache LRU cannot drop Celery tasks.
# For larger production footprints, split cache Redis vs broker Redis.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: applongpassword
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - appnet

  redis:
    image: redis:7-alpine
    # noeviction: safe for Celery broker when sharing one instance.
    # Keep cache TTLs short so memory stays bounded.
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-changeme}
      --maxmemory 256mb
      --maxmemory-policy noeviction
      --appendonly yes
      --save 60 1000
    volumes:
      - redisdata:/data
    networks:
      - appnet
    # Dev-only host access. Remove "ports" for production compose overlays.
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/1
      DATABASE_URL: postgres://appuser:applongpassword@db:5432/appdb
    depends_on:
      - db
      - redis
    networks:
      - appnet
    expose:
      - "8000"
    volumes:
      - media:/app/media
      - static:/app/static

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A config.celery worker -l info -Q bizmanager.default,bizmanager.einvoicing
    env_file:
      - backend/.env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/1
      DATABASE_URL: postgres://appuser:applongpassword@db:5432/appdb
    depends_on:
      - db
      - redis
    networks:
      - appnet
    volumes:
      - media:/app/media

  nginx:
    image: nginx:1.25
    depends_on:
      - web
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/app/media
      - static:/app/static
    networks:
      - appnet

volumes:
  pgdata:
  redisdata:
  media:
  static:

networks:
  appnet:
