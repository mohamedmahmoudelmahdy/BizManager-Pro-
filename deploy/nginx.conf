server {
    listen 80;
    server_name _;

    # Attestation multi-file submissions: ~45 MiB payload + overhead.
    client_max_body_size 50M;

    location /static/ {
        alias /app/static/;
    }

    # Do NOT publicly serve MEDIA. Sensitive attestation documents (and other
    # uploads) must be delivered only through authorized Django download APIs.
    # If other non-sensitive media must be served, add a narrowly scoped
    # internal location or a separate public prefix — never /media/attestation/.
    location /media/ {
        return 404;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (do not append) client-supplied X-Forwarded-For.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://web:8000;
    }
}
